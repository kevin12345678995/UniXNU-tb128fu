name: macos-probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Say hello from ${{ matrix.os }}
        run: |
          sw_vers
          uname -m
          which hdiutil
          df -h /