name: kernel-tb128fu-4g64g

# XNU kernel for TB128FU (4 GB / 64 GB) built with the board's own driver revision:
# xVanTuring/UniXNU carries the Tb128fuUfs and Adreno610 components and the --sm6225 switch
# that the upstream UniXNU catalog does not have.

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  UNIXNU_UEFI: ${{ github.workspace }}/uefi-tb128fu
  UNIXNU_IPSW: ${{ github.workspace }}/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
  XNU_OWNER_ROOT_VOLUME_UUID: 04769D26-2CA0-4825-B443-E2E5F88300F2

jobs:
  kernel:
    name: XNU kernel (board driver, Linux toolchain)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: UniXNU-tb128fu
          submodules: false

      - name: Check out the board's UniXNU driver
        uses: actions/checkout@v4
        with:
          repository: xVanTuring/UniXNU
          ref: 85d8ace4b50efb1bfabfb2500b448075553fd0be
          path: UniXNU

      - name: Check out the firmware (Mu-Silicium, tb128fu branch)
        uses: actions/checkout@v4
        with:
          repository: xVanTuring/uefi-tb128fu
          ref: tb128fu
          path: uefi-tb128fu
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build mtools device-tree-compiler unifdef \
            libbsd-dev uuid-dev libssl-dev zlib1g-dev libclang-dev clang llvm

      - name: Prepare the toolchain prefix for caching
        run: sudo mkdir -p /opt/unixnu-linux && sudo chown -R "$USER" /opt/unixnu-linux

      - name: Restore the Linux Mach-O toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-ubuntu2204-v2

      - name: Build the Linux Mach-O toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo ./UniXNU/scripts/linux/setup-toolchain.py --package-manager apt -j "$(nproc)"
          sudo chown -R "$USER" /opt/unixnu-linux

      - name: Save the toolchain cache
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-ubuntu2204-v2

      - name: Install the shims and verify the toolchain
        run: |
          set -eux
          sudo install -m 755 UniXNU/scripts/linux/xcrun UniXNU/scripts/linux/plutil UniXNU/scripts/linux/codesign /usr/bin/
          sudo ./UniXNU/scripts/linux/setup-toolchain.py --check --package-manager apt || \
            sudo ./UniXNU/scripts/linux/setup-toolchain.py --package-manager apt -j "$(nproc)"

      - name: Install unifdef 2.12
        run: |
          set -eux
          sudo apt-get remove -y unifdef || true
          git clone --depth 1 --branch unifdef-2.12 https://github.com/fanf2/unifdef /tmp/unifdef-src
          make -C /tmp/unifdef-src
          sudo install -m 755 /tmp/unifdef-src/unifdef /usr/local/bin/unifdef
          unifdef -V || true

      - name: Fetch sources
        run: |
          cd UniXNU
          ./unixnu fetch -D ../UniXNU-tb128fu

      - name: Apply the 4 GB / 64 GB files
        run: |
          set -eux
          MM=uefi-tb128fu/Platforms/Lenovo/tb128fuPkg/Library/MemoryMapLib/MemoryMapLib.c
          cp UniXNU-tb128fu/MemoryMapLib.c "$MM"
          cp UniXNU-tb128fu/GccUfs.h UniXNU-tb128fu/drivers/Tb128fuUfs/GccUfs.h
          cp UniXNU-tb128fu/tb128fu.dtb uefi-tb128fu/Resources/DTBs/tb128fu.dtb
          grep -n 'DRAM 0x85800000' "$MM"
          grep -n '0xd5fffa' UniXNU-tb128fu/drivers/Tb128fuUfs/GccUfs.h

      - name: Download the iPad7,1 17.7.11 restore image
        run: |
          set -eux
          mkdir -p "$(dirname "$UNIXNU_IPSW")"
          curl -L --retry 3 --retry-delay 5 -o "$UNIXNU_IPSW" \
            "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          ls -l "$UNIXNU_IPSW"

      - name: Select the configuration and fetch the IPSW components
        run: |
          cd UniXNU
          ./unixnu defconfig tb128fu_defconfig -D ../UniXNU-tb128fu
          ./unixnu status -D ../UniXNU-tb128fu
          ./unixnu ipsw fetch -D ../UniXNU-tb128fu

      - name: Build the kernel (first pass, without the archives that need a built kernel)
        run: |
          set +e
          # build-xnu-4k-baseline.sh links force_load the verified-root and PMGR archives when their
          # symbols are on, but those archives are produced after a kernel exists. Turn the two
          # features off for this pass; the second pass turns them back on.
          cd UniXNU
          # The root-binding audit needs the owner-verified block crypto, and both the verified-root
          # archive and the PMGR bridge are produced only after a kernel exists. Pass 1 runs without
          # them; pass 2 re-enables them now that the archives are on disk.
          for sym in CONFIG_XNU_VERIFIED_ROOT_PROBE CONFIG_XNU_OWNER_ROOT_AUDIT \
                     CONFIG_XNU_OWNER_ROOT_TRUST CONFIG_XNU_SHENG_PMGR \
                     CONFIG_XNU_OWNER_CACHE_MOUNT CONFIG_XNU_OWNER_CACHE_STARTUP \
                     CONFIG_XNU_OWNER_BOOT_MANIFEST CONFIG_XNU_OWNER_DATA_MOUNT \
                     CONFIG_XNU_OWNER_UNION_SYSTEMOS; do
            sed -i "s/^${sym}=y/# ${sym} is not set/" out/tb128fu/.config || true
          done
          grep -nE 'VERIFIED_ROOT_PROBE|OWNER_ROOT_|SHENG_PMGR' out/tb128fu/.config || true
          cd ..
          ( cd UniXNU && ./unixnu build kernel -D ../UniXNU-tb128fu ) > build-kernel.log 2>&1
          rc=$?
          echo "first pass exit=$rc"
          if [ $rc -ne 0 ]; then
            echo '==== driver errors ===='
            grep -n -i -m 40 'error\|not found\|missing\|undefined\|failed' build-kernel.log | tail -25 || true
            echo '==== last 40 lines ===='
            tail -n 40 build-kernel.log || true
            echo '==== kernel-bootstrap.log tail ===='
            tail -n 30 UniXNU/out/tb128fu/logs/kernel-bootstrap.log 2>/dev/null || true
          fi
          exit $rc

      - name: Build the kernel again (archives exist now, features back on)
        run: |
          set -eux
          cd UniXNU
          for sym in CONFIG_XNU_VERIFIED_ROOT_PROBE CONFIG_XNU_OWNER_ROOT_AUDIT \
                     CONFIG_XNU_OWNER_ROOT_TRUST CONFIG_XNU_SHENG_PMGR \
                     CONFIG_XNU_OWNER_CACHE_MOUNT CONFIG_XNU_OWNER_CACHE_STARTUP \
                     CONFIG_XNU_OWNER_BOOT_MANIFEST CONFIG_XNU_OWNER_DATA_MOUNT \
                     CONFIG_XNU_OWNER_UNION_SYSTEMOS; do
            sed -i "s/^# ${sym} is not set/${sym}=y/" out/tb128fu/.config || true
          done
          grep -nE 'VERIFIED_ROOT_PROBE|OWNER_ROOT_|SHENG_PMGR' out/tb128fu/.config || true
          ./unixnu build kernel -D ../UniXNU-tb128fu > ../build-kernel-2.log 2>&1
          tail -n 20 ../build-kernel-2.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb128fu-kernel-logs
          path: |
            build-kernel.log
            UniXNU/out/tb128fu/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb128fu-kernel
          path: |
            UniXNU/out/tb128fu/kernel/
            UniXNU/out/tb128fu/tree/build/**/*.macho
          if-no-files-found: warn
          retention-days: 14