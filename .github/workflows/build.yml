name: build-tb128fu-4g64g

# Builds a UniXNU boot.img for THIS tablet: Lenovo TB128FU, 4 GB RAM / 64 GB Micron UFS.
# Repository layout (this fork):
#   board.toml        - patched for 4 GB / 64 GB (last_lba, dram_size, owned_memory_size)
#   tb128fu.dtb       - generated from the tablet's live /sys/firmware/fdt
#   MemoryMapLib.c    - firmware memory map for 4 GB (copied over the Mu-Silicium file)
#   GccUfs.h          - UFS userdata window for 64 GB (copied over the Tb128fuUfs file)
#   patches/          - the same two changes as unified diffs, for reference

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'board.toml'
      - 'tb128fu.dtb'
      - 'MemoryMapLib.c'
      - 'GccUfs.h'

env:
  PYTHONUNBUFFERED: "1"
  UNIXNU_UEFI: ${{ github.workspace }}/uefi-tb128fu

jobs:
  boot-image:
    name: firmware + menu (boot.img)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: UniXNU-tb128fu
          submodules: false

      - name: Check out the UniXNU driver
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU

      - name: Check out the firmware (Mu-Silicium, tb128fu branch)
        uses: actions/checkout@v4
        with:
          repository: xVanTuring/uefi-tb128fu
          ref: tb128fu
          path: uefi-tb128fu
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build mtools device-tree-compiler unifdef \
            libbsd-dev uuid-dev libssl-dev zlib1g-dev libclang-dev clang llvm

      - name: Prepare the toolchain prefix for caching
        run: sudo mkdir -p /opt/unixnu-linux && sudo chown -R "$USER" /opt/unixnu-linux

      - name: Restore the Linux Mach-O toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-ubuntu2204-v2

      - name: Build the Linux Mach-O toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo ./UniXNU/scripts/linux/setup-toolchain.py --package-manager apt -j "$(nproc)"
          sudo chown -R "$USER" /opt/unixnu-linux

      - name: Save the toolchain cache
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-ubuntu2204-v2

      - name: Install the shims and verify the toolchain
        run: |
          set -eux
          sudo install -m 755 UniXNU/scripts/linux/xcrun UniXNU/scripts/linux/plutil UniXNU/scripts/linux/codesign /usr/bin/
          sudo ./UniXNU/scripts/linux/setup-toolchain.py --check --package-manager apt || \
            sudo ./UniXNU/scripts/linux/setup-toolchain.py --package-manager apt -j "$(nproc)"

      - name: Fetch sources (initialises the module submodules)
        run: |
          cd UniXNU
          ./unixnu fetch -D ../UniXNU-tb128fu

      - name: Apply the 4 GB / 64 GB changes
        run: |
          set -eux
          MM=uefi-tb128fu/Platforms/Lenovo/tb128fuPkg/Library/MemoryMapLib/MemoryMapLib.c
          cp UniXNU-tb128fu/MemoryMapLib.c "$MM"
          cp UniXNU-tb128fu/GccUfs.h UniXNU-tb128fu/drivers/Tb128fuUfs/GccUfs.h
          cp UniXNU-tb128fu/tb128fu.dtb uefi-tb128fu/Resources/DTBs/tb128fu.dtb
          # fail loudly if the copied files are not the 4 GB / 64 GB versions
          grep -n "DRAM 0x85800000" "$MM"
          grep -n "0x04800000" "$MM"
          grep -n "0xd5fffa" UniXNU-tb128fu/drivers/Tb128fuUfs/GccUfs.h
          grep -c "0x100000000" UniXNU-tb128fu/board.toml
          git -C uefi-tb128fu diff --stat
          git -C UniXNU-tb128fu/drivers/Tb128fuUfs diff --stat
          git -C UniXNU-tb128fu diff --stat

      - name: Select the kernel configuration
        run: |
          cd UniXNU
          ./unixnu defconfig tb128fu_defconfig -D ../UniXNU-tb128fu
          ./unixnu status -D ../UniXNU-tb128fu

      - name: Make the firmware boot UniXNU without any key press
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          # 1) Volume Up currently aborts the boot order and opens the Mu Boot Manager, which needs
          #    arrow keys this board cannot deliver. Drop the flag so BDS boots BootOrder[0] directly.
          kc = Path('uefi-tb128fu/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/KeyCallback.c')
          s = kc.read_text()
          if 'mEnterBootManager = TRUE;' in s:
              s = s.replace('  // Toggle Boot Manager Flag\n  mEnterBootManager = TRUE;',
                            '  // TB128FU: no usable key input; never divert the boot order.\n  (VOID)mEnterBootManager;', 1)
              kc.write_text(s)
          print('key callback patched:', 'mEnterBootManager = TRUE;' not in kc.read_text())
          # 2) No countdown at platform level either.
          dsc = Path('uefi-tb128fu/Platforms/Lenovo/tb128fuPkg/tb128fu.dsc')
          d = dsc.read_text()
          if 'PcdPlatformBootTimeOut' not in d:
              d = d.replace('[PcdsFixedAtBuild]',
                            '[PcdsFixedAtBuild]\n  gEfiMdePkgTokenSpaceGuid.PcdPlatformBootTimeOut|0', 1)
              dsc.write_text(d)
          print('boot timeout pcd:', 'PcdPlatformBootTimeOut|0' in dsc.read_text())
          # 3) BDS must not be able to fall through to any menu: boot the first load option here.
          bm = Path('uefi-tb128fu/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c')
          b = bm.read_text()
          marker = '  // Execute Secondary After Console\n  DeviceBootManagerAfterConsole ();'
          boot_block = (
              '  // TB128FU: no usable console input. Boot the first option and never reach a menu.\n'
              '  {\n'
              '    EFI_BOOT_MANAGER_LOAD_OPTION  Option;\n'
              '    UINTN                         OptionCount = 0;\n'
              '    if (!EFI_ERROR (EfiBootManagerGetLoadOptions (&Option, &OptionCount)) && OptionCount > 0) {\n'
              '      EfiBootManagerBoot (&Option);\n'
              '      EfiBootManagerFreeLoadOption (&Option);\n'
              '    }\n'
              '  }\n'
          )
          if marker in b and 'never reach a menu' not in b:
              b = b.replace(marker, boot_block + marker, 1)
              bm.write_text(b)
          print('bds direct boot:', 'never reach a menu' in bm.read_text())
          # 4) The UniXNU menu itself: always count down, whatever input devices exist.
          mc = Path('UniXNU/package/UniXNUPkg/Library/UniXNULib/Menu.c')
          m = mc.read_text()
          old = '    RemainingMs = HasInput ? -1 : (INTN)Config->FallbackTimeout * 1000;'
          new = '    RemainingMs = (INTN)((Config->Timeout > 0) ? Config->Timeout : 1) * 1000;  // TB128FU: no key input'
          if old in m:
              m = m.replace(old, new)
              mc.write_text(m)
          print('menu auto-boot patch:', 'TB128FU: no key input' in mc.read_text())
          PY
          grep -n 'TB128FU: no usable key input' uefi-tb128fu/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/KeyCallback.c || true
          grep -n 'PcdPlatformBootTimeOut' uefi-tb128fu/Platforms/Lenovo/tb128fuPkg/tb128fu.dsc || true

      - name: Build package and firmware (runs scripts/check-tb128fu.py)
        run: |
          cd UniXNU
          ./unixnu build package  -D ../UniXNU-tb128fu
          ./unixnu build firmware -D ../UniXNU-tb128fu

      - name: Build the UEFI probe app and its FAT payload
        run: |
          set -eux
          # Build against the tree's own EDK2 headers: the struct layouts come from MdePkg, not
          # from hand-written declarations (the v1 probe guessed them and could fault).
          clang --target=aarch64-unknown-windows -ffreestanding -fshort-wchar -O1 \
            -I uefi-tb128fu/Mu_Basecore/MdePkg/Include \
            -I uefi-tb128fu/Mu_Basecore/MdePkg/Include/AArch64 \
            -c UniXNU-tb128fu/tools/uefiapp/tb128fu_probe2.c -o /tmp/tb128fu_probe.o
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:arm64 \
            /out:/tmp/BOOTAA64.EFI /tmp/tb128fu_probe.o
          file /tmp/BOOTAA64.EFI || true
          ls -l /tmp/BOOTAA64.EFI
          # 8 MiB is below the FAT32 cluster minimum, so let mtools pick FAT16 here
          mformat -C -T 16384 -v TB128FUESP -i /tmp/payload.img ::
          mmd -i /tmp/payload.img ::/EFI ::/EFI/BOOT
          mcopy -i /tmp/payload.img /tmp/BOOTAA64.EFI ::/EFI/BOOT/BOOTAA64.EFI
          mdir -i /tmp/payload.img ::/EFI/BOOT

      - name: Pack the boot image
        run: |
          cd UniXNU
          ./unixnu bootimg -D ../UniXNU-tb128fu \
            --dtb "$UNIXNU_UEFI/Resources/DTBs/tb128fu.dtb" --ramdisk /tmp/payload.img

      - name: Show the preflight report
        if: always()
        run: |
          for f in $(find . -name check.json); do echo "== $f"; cat "$f"; done

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: tb128fu-4g64g-boot
          path: |
            UniXNU/out/tb128fu/boot/
            UniXNU/out/tb128fu/check.json
          if-no-files-found: warn
          retention-days: 14

  payload-macos:
    name: XNU kernel + payload (macOS only, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - name: Check out everything
        run: |
          set -eux
          git clone --depth 1 https://github.com/UniXNU/UniXNU
          git clone --depth 1 -b tb128fu https://github.com/xVanTuring/uefi-tb128fu
          git clone --depth 1 "https://github.com/${{ github.repository }}" UniXNU-tb128fu
          brew install llvm lld cmake ninja mtools dtc unifdef

      - name: Fetch sources and apply the 4 GB / 64 GB changes
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-tb128fu
        run: |
          set -eux
          cd UniXNU
          ./unixnu fetch -D ../UniXNU-tb128fu
          cd ..
          cp UniXNU-tb128fu/MemoryMapLib.c uefi-tb128fu/Platforms/Lenovo/tb128fuPkg/Library/MemoryMapLib/MemoryMapLib.c
          cp UniXNU-tb128fu/GccUfs.h UniXNU-tb128fu/drivers/Tb128fuUfs/GccUfs.h
          cp UniXNU-tb128fu/tb128fu.dtb uefi-tb128fu/Resources/DTBs/tb128fu.dtb
          grep -n "DRAM 0x85800000" uefi-tb128fu/Platforms/Lenovo/tb128fuPkg/Library/MemoryMapLib/MemoryMapLib.c

      - name: Download the iPad7,1 17.7.11 restore image
        run: |
          set -eux
          mkdir -p ipsw
          curl -L --retry 3 -o ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw \
            "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          shasum -a 256 ipsw/*.ipsw || true

      - name: Build the kernel twice (the first link has no PMGR reference)
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-tb128fu
          UNIXNU_IPSW: ${{ github.workspace }}/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -eux
          cd UniXNU
          ./unixnu ipsw fetch -D ../UniXNU-tb128fu
          ./unixnu build kernel -D ../UniXNU-tb128fu
          ./unixnu build kernel -D ../UniXNU-tb128fu

      - name: Upload the kernel objects
        uses: actions/upload-artifact@v4
        with:
          name: tb128fu-4g64g-kernel
          path: |
            UniXNU/out/tb128fu/tree/build/**/*.macho
            UniXNU/out/tb128fu/tree/build/**/*.adt
          if-no-files-found: warn
          retention-days: 14